name: Build Dashboard Docker Image [DEV]

on:
  push:
    branches: [ dev ]
    paths:
      - 'dashboard/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dashboard dependencies
        run: |
          cd dashboard
          npm ci
          
      - name: Run lint
        run: |
          cd dashboard
          npm run lint
          
      - name: Run tests
        run: |
          cd dashboard
          npm test
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v4
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/f1-interactive-dashboard:dev-latest
            ghcr.io/${{ github.repository_owner }}/f1-interactive-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
