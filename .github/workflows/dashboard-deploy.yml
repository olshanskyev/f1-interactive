name: Deploy Dashboard Docker Image [PROD]

on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/**'  

permissions:
  contents: write
  packages: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all history for commit parsing
      
      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Determine Next Version & Bump package.json
        id: version_bump
        run: |
          cd dashboard
          # commit-and-tag-version parses conventional commits and updates package.json/package-lock.json
          npx commit-and-tag-version --commit-all
          
          # Extract the newly generated version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          
          # Push the version bump commit and the tag generated by standard-version to main
          git push --follow-tags origin main

      - name: Run lint
        run: |
          cd dashboard
          npm run lint
          
      - name: Run tests
        run: |
          cd dashboard
          npm test
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v4
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/f1-interactive-dashboard:v${{ steps.version_bump.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/f1-interactive-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- POST ACTION: Update dev branch ---
      # This checks out dev, merges main (syncing the release state), 
      # bumps the patch version, and pushes back to dev.
      - name: Update dev branch version (patch bump)
        run: |
          # Fetch and checkout dev branch
          git fetch origin dev
          git checkout dev
          
          # Sync dev with the newly released main branch to avoid conflicts
          git merge origin/main --no-edit
          
          cd dashboard
          # Bump the patch version without creating a git tag
          npm version patch --no-git-tag-version
          
          # Commit and push back to dev
          git add package.json package-lock.json
          git commit -m "chore(dev): bump version for next development cycle"
          git push origin dev
