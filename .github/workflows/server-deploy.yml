name: Deploy Server Docker image [PROD]

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/f1-interactive-server/**'
      - 'backend/common/**'
  workflow_dispatch: {}
  
permissions:
  contents: write # Required for generating tags and pushing to the dev branch
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all commits for version calculation

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Determine Next Version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true # <--- Only calculate the version, don't create the tag yet
          # This action calculates version based on conventional commits:
          # feat! = major, feat = minor, fix = patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set version in pom.xml and push to main
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          echo "Setting release version: $NEW_VERSION"
          mvn -B -f backend/f1-interactive-server/pom.xml versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
          
          # Commit the release version to main
          git commit -am "chore(release): bump version to $NEW_VERSION [skip ci]"
          
          # Create an annotated tag and push both the commit and tag to main
          git tag -a v$NEW_VERSION -m "chore(release): version v$NEW_VERSION"
          git push --follow-tags origin main

      - name: Build backend/common and install to local repo
        run: mvn -B -f backend/common/pom.xml install

      - name: Build f1-interactive-server
        run: mvn -B -f backend/f1-interactive-server/pom.xml package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: backend/f1-interactive-server
          file: backend/f1-interactive-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/f1-interactive-server:v${{ steps.version.outputs.new_version }}
            ghcr.io/${{ github.repository_owner }}/f1-interactive-server:latest

      - name: Post-action - Update dev branch version
        run: |
          # Calculate next patch version for dev
          CURRENT_VERSION=${{ steps.version.outputs.new_version }}
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          PATCH=${ADDR[2]}
          NEXT_PATCH=$((PATCH + 1))
          
          # Append -SNAPSHOT for standard maven dev tracking
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"
          
          echo "Updating dev branch to version: $NEXT_VERSION"
          
          # Fetch and checkout dev branch
          git fetch origin dev
          git checkout dev
          
          # Sync dev with the newly released main branch to avoid conflicts
          git merge origin/main --no-edit
          
          # Update version in dev POMs
          mvn -B -f backend/f1-interactive-server/pom.xml versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false
          
          # Commit and push back to dev
          git commit -am "chore(release): bump version to $NEXT_VERSION for next development cycle"
          git push origin dev
