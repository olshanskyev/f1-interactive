name: Build Server Docker image [DEV]

on:
  push:
    branches: [ dev ]
    paths:
      - 'backend/f1-interactive-server/**'
      - 'backend/common/**'
      - 'backend/tools/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend/common and install to local repo
        run: mvn -B -f backend/common/pom.xml install

      - name: Build f1-interactive-server
        run: mvn -B -f backend/f1-interactive-server/pom.xml package

      - name: Build and copy f1-interactive-simulator (if exists)
        run: |
          if [ -f "backend/tools/f1-interactive-simulator/pom.xml" ]; then
            mvn -B -f backend/tools/f1-interactive-simulator/pom.xml package -DskipTests
            cp backend/tools/f1-interactive-simulator/target/*.jar backend/f1-interactive-server/target/ 2>/dev/null || true
          fi

      - name: Build and copy f1-interactive-sniffer (if exists)
        run: |
          if [ -f "backend/tools/f1-interactive-sniffer/pom.xml" ]; then
            mvn -B -f backend/tools/f1-interactive-sniffer/pom.xml package -DskipTests
            cp backend/tools/f1-interactive-sniffer/target/*.jar backend/f1-interactive-server/target/ 2>/dev/null || true
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: backend/f1-interactive-server
          file: backend/f1-interactive-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/f1-interactive-server:dev-latest
            ghcr.io/${{ github.repository_owner }}/f1-interactive-server:${{ github.sha }}
