name: Build and Publish DB Docker Image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DB image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/f1-interactive_db
          file: ./backend/f1-interactive_db/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/f1-interactive-db:latest
            ghcr.io/${{ github.repository_owner }}/f1-interactive-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
