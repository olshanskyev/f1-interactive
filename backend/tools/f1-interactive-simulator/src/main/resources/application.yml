server:
  port: 8081
  servlet:
    contextPath: /api
  ssl:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local,default
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null
f1interactive:
  heartbeatIntervalMillis: 15000
  sse:
    # higher limit: fast playback produces bursts
    maxPendingEvents: 2000
    slowSendWarnMillis: 5000