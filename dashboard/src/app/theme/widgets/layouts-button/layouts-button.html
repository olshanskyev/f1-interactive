<button matButton [matMenuTriggerFor]="menu">
  <mat-icon>settings</mat-icon>
  <span>{{ 'layout.layout_settings' | translate }}</span>
</button>

<mat-menu #menu="matMenu">
  <div class="menu">
    <h4 class="p-x-12 m-y-8">{{ 'layout.layout_presets' | translate }}</h4>
    <div class="m-8 b-1 r-8">
        <button class="text-center" mat-menu-item (click)="activateDefault()">
          <span>{{ 'layout.default_layout' | translate }}</span>
        </button>
    </div>

    <mat-divider />
    <h4 class="p-x-12 m-y-8">{{ 'layout.my_layouts' | translate }}</h4>
    @if (customLayouts().length === 0) {
      <div class="m-8 text-color-second">
        {{'nothing_found' | translate}}
      </div>
    } @else {
      <div class="custom-layouts-container m-x-8">
        @for(item of customLayouts(); track item.id) {
          <div class="b-1 r-8 d-flex flex-row">
            <button class="text-center" mat-menu-item (click)="activateLayout(item)">
              <span>{{ item.layoutName }}</span>
            </button>
            <div class="d-flex flex-col button-5">
              <button matIconButton>
                <mat-icon class="small-icon" (click)="onEditCustomLayout(item)">edit</mat-icon>
              </button>
              <button matIconButton (click)="onDeleteCustomLayout(item)">
                <mat-icon class="small-icon">delete</mat-icon>
              </button>
            </div>
          </div>

        }
      </div>
    }
    <mat-divider />
    <button mat-menu-item (click)="onCreateNewLayout()">
      <mat-icon class="text-color-primary">dashboard_customize</mat-icon>
      <span class="text-color-primary">{{ 'layout.create_layout' | translate }}</span>
    </button>
  </div>
</mat-menu>
