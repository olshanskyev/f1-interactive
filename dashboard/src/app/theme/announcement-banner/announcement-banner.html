@for (message of messages(); track message.id) {
  <div class="announcement d-flex align-items-center gap-12 p-y-4 p-r-8 p-l-16" role="status">
    <mat-icon class="flex-shrink-0">campaign</mat-icon>
    <span class="flex-fill">{{ message.text }}</span>

    <div class="announcement-actions d-flex align-items-center gap-4">
      <button mat-icon-button [attr.aria-label]="'close' | translate" (click)="dismiss(message.id)">
        <mat-icon>close</mat-icon>
      </button>
      <app-donate-button/>
    </div>
  </div>
}
