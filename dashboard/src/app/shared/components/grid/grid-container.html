<div class="grid-wrapper">
    <!-- backgound grid -->

    <div #backgroundGrid class="grid-container background-grid"
        [class.portrait]="isPortrait()">
        @if(displayGrid()) {
            @for (i of [].constructor(gridRows()*gridColumns()); track $index) {
                <div class="grid-cell">
                </div>
            }
        }
    </div>

    <div class="grid-container overlay-grid"
        [class.portrait]="isPortrait()">
        <ng-content/>
    </div>

</div>
