<div class="place-self-start">
        <p class="m-0 f-s-14"
        [class]="(timingData()?.LastLapTime?.OverallFastest)?'text-f1-purple':
                (timingData()?.LastLapTime?.PersonalFastest)?'text-f1-green':''">
        {{timingData()?.LastLapTime?.Value || '-'}}
        </p>
        <p class="m-0 f-s-12 line-height-1"
        [class]="(timingStat()?.PersonalBestLapTime?.Position === 1)?'text-f1-purple':'text-f1-green'"
        >
        {{timingStat()?.PersonalBestLapTime?.Value}}
        </p>
</div>
