<driver-chip [driver]="driver()" [timingData]="timingData()" [timingAppData]="timingAppData()"/>
<interval-chip [timingData]="timingData()"/>
<lap-chip [timingData]="timingData()" [timingStat]="timingStat()"/>

@for(speed of timingData()?.Speeds | keyvalue; track speed.key) {
  <div>
    <p class="m-0 f-s-14"
      [class.text-f1-purple]="speed.value.OverallFastest"
      [class.text-f1-green]="speed.value.PersonalFastest"
      [class.text-color-inactive]="!speed.value.Value"
      >
        {{speed.value.Value || '-'}}
    </p>
    <p class="m-0 f-s-12 line-height-1"
      [class]="hasBestSpeed(speed.key)?'text-f1-purple':'text-f1-green'">

      {{timingStat()?.BestSpeeds?.[speed.key]?.Value || ''}}
    </p>
  </div>
}
