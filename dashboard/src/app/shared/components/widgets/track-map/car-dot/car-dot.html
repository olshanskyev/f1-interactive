<svg:circle [attr.r]="(favouriteDriver())?300:180" />

<svg:g [attr.transform]="'translate(' + ((favouriteDriver()) ? 250 : 100) + ',' + ((favouriteDriver()) ? -750 : -550) + ')'">
    <svg:rect
        class="driver-bg"
        [class.favourite-bg]="favouriteDriver()"
        x="0" y="0"
        [attr.width]="favouriteDriver() ? 1500 : 1100"
        [attr.height]="favouriteDriver() ? 620 : 480"
        rx="240" ry="240" />

    @if (favouriteDriver()) {
        <svg:rect
            class="favourite-team-color"
            x="200" y="120"
            width="80" height="380" />
    }

    <svg:text
        class="driver-text"
        [class.favourite-text]="favouriteDriver()"
        [attr.x]="favouriteDriver() ? 890 : 550"
        [attr.y]="favouriteDriver() ? 455 : 340"
        text-anchor="middle">
        {{ name() }}
    </svg:text>
</svg:g>
