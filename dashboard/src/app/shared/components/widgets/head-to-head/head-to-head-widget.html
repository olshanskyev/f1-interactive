<div class="font-formula"
    [class.default-widget-container]="container"
>
    <div class="p-y-8 head-to-head-widget-container">
        <div class="select-driver-container">
            <select-driver-widget />
        </div>

        <div class="d-flex two-drivers-container m-b-8">
            @if (mode() === 'telemetry') {
                @if (headToHeadDriver1(); as driver) {
                    <head-to-head-telemetry-card [driver]="driver" [channels]="channels1()" />
                }
                @if (headToHeadDriver2(); as driver) {
                    <head-to-head-telemetry-card [driver]="driver" [channels]="channels2()" />
                }
                @if (!headToHeadDriver1() && !headToHeadDriver2()) {
                    <div class="text-color-second d-flex align-items-center justify-content-center relative">
                        <speedo
                        [speed]="0"
                        [rpm]="0"
                        [gear]="0"
                        [throttle]="0"
                        [brake]="0"
                        />
                        <div class="skeleton-overlay">
                            <head-to-head-driver-skeleton />
                        </div>
                    </div>
                }
            } @else if (mode() === 'time_attack') {
                <head-to-head-time-attack
                    [bestLapTime]="bestLapTime()?.bestLapTime"
                    [bestDriver]="bestDriver()"
                    [driver1]="headToHeadDriver1()"
                    [driver2]="headToHeadDriver2()"
                />
            } @else {
                <head-to-head-lap-comparison
                    [mode]="mode() === 'best' ? 'best' : 'last'"
                    [driver1]="headToHeadDriver1()"
                    [driver2]="headToHeadDriver2()"
                />
            }
        </div>
    </div>

</div>
