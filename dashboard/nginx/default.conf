server {
  listen 80;
  server_name __HOST__ www.__HOST__;

  # HTTP_ONLY_START
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/live {
    proxy_pass http://server:8080/api/live;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/simulator {
    proxy_pass http://server:8081/api/simulator;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/simulator/live {
    proxy_pass http://server:8081/api/simulator/live;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  location ~ /\. {
    allow all;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
  # HTTP_ONLY_END

  # HTTPS_REDIRECT_START
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
  # HTTPS_REDIRECT_END
}

# HTTPS_SERVER_START
server {
  listen 443 ssl;
  server_name __HOST__ www.__HOST__;

  ssl_certificate __CERT_PATH__fullchain.pem;
  ssl_certificate_key __CERT_PATH__privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Serve existing files, otherwise fall back to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the f1-interactive-server container
  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxies SSE endpoint for real-time streaming
  location /api/live {
    proxy_pass http://server:8080/api/live;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/simulator {
    proxy_pass http://server:8081/api/simulator;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/simulator/live {
    proxy_pass http://server:8081/api/simulator/live;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static assets: serve directly with long caching
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  # Do not expose hidden files
  location ~ /\. {
    allow all; # Allow /.well-known for acme, but block others below
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
# HTTPS_SERVER_END
