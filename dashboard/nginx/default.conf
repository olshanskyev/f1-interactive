server {
  listen 80;
  server_name f1interactive.net www.f1interactive.net;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name f1interactive.net www.f1interactive.net;

  ssl_certificate /etc/letsencrypt/live/f1interactive.net-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/f1interactive.net-0001/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Serve existing files, otherwise fall back to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the f1-interactive-server container
  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxies SSE endpoint for real-time streaming
  location /api/live {
    proxy_pass http://server:8080/api/live;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static assets: serve directly with long caching
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  # Do not expose hidden files
  location ~ /\. {
    allow all; # Allow /.well-known for acme, but block others below
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}